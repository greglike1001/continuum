# Builds a sideloadable VLC for Android APK with Picture-in-Picture unlocked on
# Android TV (Sony Bravia and friends). The official release APK is downloaded
# from VideoLAN, its dex is patched (see scripts/vlc-pip/), and the result is
# re-signed. Nothing in this repository is built or shipped by this workflow.
name: VLC PiP APK

on:
  workflow_dispatch:
    inputs:
      vlc_version:
        description: "VLC for Android version (blank = newest stable on get.videolan.org)"
        required: false
        default: ""
      abis:
        description: "Space separated ABIs to patch"
        required: false
        default: "arm64-v8a armeabi-v7a"
  push:
    branches:
      - claude/vlc-android-pip-apk-om9cjc
    paths:
      - scripts/vlc-pip/**
      - .github/workflows/vlc-pip-apk.yml

permissions:
  contents: read

env:
  SMALI_URL: "https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar"
  SMALI_SHA256: "9544299578b16f771d8aa8eaefe0d3718ca03478c16f3c356f2fcf1366bfb116"
  BAKSMALI_URL: "https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar"
  BAKSMALI_SHA256: "d3116248cce4f82ec5a31eb7f95ee75daff42ddf6eed0ab573973dc53fbad2e5"
  KOTLINC_URL: "https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip"
  KOTLINC_SHA256: "a118197b0de55ffab2bc8d5cd03a5e39033cfb53383d6931bc761dec0784891a"
  DX_URL: "https://repo1.maven.org/maven2/com/jakewharton/android/repackaged/dalvik-dx/16.0.1/dalvik-dx-16.0.1.jar"
  DX_SHA256: "1e4b645628e3bdb097b5331d669e177ef235a551582a8c646dbe36865e541907"
  KEYSTORE_PASS: "vlcpip"
  KEY_ALIAS: "vlcpip"

jobs:
  # Exercises the patcher against Kotlin compiled here, so a broken patch is
  # caught even when get.videolan.org cannot be reached.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o smali.jar "$SMALI_URL"
          echo "$SMALI_SHA256  smali.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o baksmali.jar "$BAKSMALI_URL"
          echo "$BAKSMALI_SHA256  baksmali.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o dalvik-dx.jar "$DX_URL"
          echo "$DX_SHA256  dalvik-dx.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o kotlinc.zip "$KOTLINC_URL"
          echo "$KOTLINC_SHA256  kotlinc.zip" | sha256sum -c -
          unzip -q kotlinc.zip

      - name: Run selftest
        run: |
          set -euo pipefail
          KOTLINC=$PWD/kotlinc/bin/kotlinc \
          DX_JAR=$PWD/dalvik-dx.jar \
          BAKSMALI_JAR=$PWD/baksmali.jar \
          SMALI_JAR=$PWD/smali.jar \
          scripts/vlc-pip/selftest.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android build-tools
        run: |
          set -euo pipefail
          sdk=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          tools=$(ls -1d "$sdk"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$tools" ]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null
            tools="$sdk/build-tools/35.0.0"
          fi
          echo "BUILD_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "using $tools"

      - name: Fetch smali tooling
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o smali.jar "$SMALI_URL"
          echo "$SMALI_SHA256  smali.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o baksmali.jar "$BAKSMALI_URL"
          echo "$BAKSMALI_SHA256  baksmali.jar" | sha256sum -c -
          echo "SMALI_JAR=$PWD/smali.jar" >> "$GITHUB_ENV"
          echo "BAKSMALI_JAR=$PWD/baksmali.jar" >> "$GITHUB_ENV"

      - name: Download official VLC APKs
        id: download
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.vlc_version }}
          ABIS: ${{ github.event.inputs.abis || 'arm64-v8a armeabi-v7a' }}
        run: |
          set -euo pipefail
          base="https://get.videolan.org/vlc-android"
          version="${REQUESTED_VERSION:-}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL "$base/" \
              | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
              | sort -V | tail -1)
          fi
          echo "VLC version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p downloads
          listing=$(curl -fsSL "$base/$version/")
          echo "$listing" | grep -oE 'href="[^"]+\.apk"' | sed 's/href="//;s/"//' | sort -u
          for abi in $ABIS; do
            file=$(echo "$listing" \
              | grep -oE "href=\"[^\"]*${abi}[^\"]*\.apk\"" \
              | sed 's/href="//;s/"//' | sort -u | head -1)
            if [ -z "$file" ]; then
              echo "::error::no APK for ABI $abi in $base/$version/"
              exit 1
            fi
            echo "downloading $file"
            curl -fsSL --retry 3 -o "downloads/$file" "$base/$version/$file"
            # VideoLAN publishes checksums next to the binaries; use them when present.
            if curl -fsSL --retry 2 -o "downloads/$file.sha256" "$base/$version/$file.sha256"; then
              ( cd downloads && sha256sum -c "$file.sha256" )
            else
              rm -f "downloads/$file.sha256"
              echo "no published .sha256 for $file"
            fi
          done
          ls -l downloads
          sha256sum downloads/*.apk

      - name: Create signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore vlcpip.keystore \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -dname "CN=VLC PiP sideload build, OU=Personal, O=Personal, C=AU"
          echo "KEYSTORE=$PWD/vlcpip.keystore" >> "$GITHUB_ENV"

      - name: Patch and sign
        run: |
          set -euo pipefail
          mkdir -p out
          for apk in downloads/*.apk; do
            name=$(basename "$apk" .apk)
            echo "::group::$name"
            scripts/vlc-pip/patch-vlc-pip.sh "$apk" "out/${name}-pip.apk"
            echo "::endgroup::"
          done
          ls -l out

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## VLC ${{ steps.download.outputs.version }} with Picture-in-Picture unlocked"
            echo
            echo "Signed with a throwaway key (keystore in the artifact, password \`$KEYSTORE_PASS\`, alias \`$KEY_ALIAS\`)."
            echo "The official VLC signature is replaced, so an existing VLC install must be uninstalled first."
            echo
            echo '```'
            sha256sum out/*.apk 2>/dev/null || echo "no APK produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlc-pip-apk
          path: |
            out/*.apk
            vlcpip.keystore
          if-no-files-found: warn
          retention-days: 90
