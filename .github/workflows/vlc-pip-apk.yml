# Builds a sideloadable VLC for Android APK with Picture-in-Picture unlocked on
# Android TV (Sony Bravia and friends). The official release APK is downloaded
# from VideoLAN, its dex is patched (see scripts/vlc-pip/), and the result is
# re-signed. Nothing in this repository is built or shipped by this workflow.
name: VLC PiP APK

on:
  workflow_dispatch:
    inputs:
      vlc_version:
        description: "VLC for Android version (blank = newest stable on get.videolan.org)"
        required: false
        default: ""
      abis:
        description: "Space separated ABIs to patch"
        required: false
        default: "arm64-v8a armeabi-v7a"
  push:
    branches:
      - claude/vlc-android-pip-apk-om9cjc
    paths:
      - scripts/vlc-pip/**
      - .github/workflows/vlc-pip-apk.yml

permissions:
  contents: read

env:
  SMALI_URL: "https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar"
  SMALI_SHA256: "9544299578b16f771d8aa8eaefe0d3718ca03478c16f3c356f2fcf1366bfb116"
  BAKSMALI_URL: "https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar"
  BAKSMALI_SHA256: "d3116248cce4f82ec5a31eb7f95ee75daff42ddf6eed0ab573973dc53fbad2e5"
  KOTLINC_URL: "https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip"
  KOTLINC_SHA256: "a118197b0de55ffab2bc8d5cd03a5e39033cfb53383d6931bc761dec0784891a"
  DX_URL: "https://repo1.maven.org/maven2/com/jakewharton/android/repackaged/dalvik-dx/16.0.1/dalvik-dx-16.0.1.jar"
  DX_SHA256: "1e4b645628e3bdb097b5331d669e177ef235a551582a8c646dbe36865e541907"
  KEYSTORE_PASS: "vlcpip"
  KEY_ALIAS: "vlcpip"

jobs:
  # Exercises the patcher against Kotlin compiled here, so a broken patch is
  # caught even when get.videolan.org cannot be reached.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o smali.jar "$SMALI_URL"
          echo "$SMALI_SHA256  smali.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o baksmali.jar "$BAKSMALI_URL"
          echo "$BAKSMALI_SHA256  baksmali.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o dalvik-dx.jar "$DX_URL"
          echo "$DX_SHA256  dalvik-dx.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o kotlinc.zip "$KOTLINC_URL"
          echo "$KOTLINC_SHA256  kotlinc.zip" | sha256sum -c -
          unzip -q kotlinc.zip

      - name: Run selftest
        run: |
          set -euo pipefail
          KOTLINC=$PWD/kotlinc/bin/kotlinc \
          DX_JAR=$PWD/dalvik-dx.jar \
          BAKSMALI_JAR=$PWD/baksmali.jar \
          SMALI_JAR=$PWD/smali.jar \
          scripts/vlc-pip/selftest.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore vlcpip.keystore \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -dname "CN=VLC PiP sideload build, OU=Personal, O=Personal, C=AU"

      - name: Build patched APKs
        id: build
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.vlc_version }}
          ABIS: ${{ github.event.inputs.abis || 'arm64-v8a armeabi-v7a' }}
        run: |
          set -euo pipefail
          args=()
          for abi in $ABIS; do args+=(--abi "$abi"); done
          if [ -n "${REQUESTED_VERSION:-}" ]; then args+=(--version "$REQUESTED_VERSION"); fi
          python3 scripts/vlc-pip/vlc_pip_build.py \
            "${args[@]}" \
            --out-dir out \
            --tools-dir tools \
            --keystore vlcpip.keystore \
            --ks-pass "$KEYSTORE_PASS" \
            --ks-alias "$KEY_ALIAS"
          ls -l out

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## VLC with Picture-in-Picture unlocked on Android TV"
            echo
            echo "Signed with a throwaway key (keystore in the artifact, password \`$KEYSTORE_PASS\`, alias \`$KEY_ALIAS\`)."
            echo "The official VLC signature is replaced, so an existing VLC install must be uninstalled first."
            echo
            echo '```'
            sha256sum out/*-pip.apk 2>/dev/null || echo "no APK produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlc-pip-apk
          path: |
            out/*-pip.apk
            vlcpip.keystore
          if-no-files-found: warn
          retention-days: 90
